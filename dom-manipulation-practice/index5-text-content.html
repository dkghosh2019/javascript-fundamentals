<!DOCTYPE html>
<html>
<head>
<style>
  .hidden-text {
    display: none;
  }
</style>
</head>
<body>

  <!-- 
    LEARNING NOTE: Content Injection Methods
    
    1. element.innerText:
       - Deals only with human-readable text content [1].
       - Aware of CSS styling [1]. It completely ignores text hidden via 'display: none'.
       
    2. element.textContent:
       - Returns the raw text contained within a node, including formatting and spacing [1].
       - Unaware of CSS styling [1]. It will read text hidden via 'display: none'.
       - Safe from Cross-Site Scripting (XSS) because it treats HTML tags strictly as plain text.
       
    3. element.innerHTML:
       - Parses and renders actual HTML markup strings directly into the DOM tree [1].
       - DANGEROUS when handling raw user inputs. If input contains a malicious script string 
         (e.g., <img src=x onerror="alert('Hacked')">), the browser executes it, creating an XSS vulnerability.
  -->

  <h2>Topic Mastery: innerText vs textContent vs innerHTML</h2>

  <div id="sample-box">
    Hello World! 
    <span class="hidden-text">I am secret hidden text.</span>
  </div>

  <hr>

  <h3>Outputs:</h3>
  <p><strong>innerText output:</strong> <span id="innerText-display"></span></p>
  <p><strong>textContent output:</strong> <span id="textContent-display"></span></p>
  <p><strong>innerHTML markup injection test:</strong> <div id="innerHTML-display"></div></p>

  <button type="button" onclick="demonstrateContent()">Read and Inject Content</button>

  <script>
  function demonstrateContent() {
    const sampleBox = document.getElementById('sample-box');

    // 1. Reading content differences
    // innerText skips the hidden span [1]. textContent reads everything inside [1].
    const textDataInner = sampleBox.innerText;
    const textDataContent = sampleBox.textContent;

    // Output the strings safely to the screen
    document.getElementById('innerText-display').textContent = textDataInner;
    document.getElementById('textContent-display').textContent = textDataContent;

    // 2. HTML Injection vs. Safety
    // We construct a string containing actual HTML elements
    const htmlString = "<em>This text is italicized because HTML tags were processed!</em>";

    // innerHTML treats the string as code and renders it on the fly
    document.getElementById('innerHTML-display').innerHTML = htmlString;
  }
  </script>

</body>
</html>
